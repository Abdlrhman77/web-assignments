<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عبدالرحمن الشميري</title>
  </head>
  <body>
    <!-- العنوان الرئيسي -->
    <h1>عبدالرحمن الشميري</h1>

    <!-- الفقرة الترحيبية -->
    <p>مرحبًا بكم في صفحتي الشخصية، أتمنى لكم يومًا سعيدًا .</p>

    <!-- رابط إلى Google -->

    <a href="https://www.google.com" target="_blank" rel="noopener">Google</a>

    <!-- القائمة ال غير مرتبة  -->
    <ul>
      <li>مطور برمجيات</li>
      <li>مهتم بالتعلم المستمر</li>
      <li>مساعد الآخرين في التقنية</li>
    </ul>

    <!-- target استخدامات انواع ال  -->

    <!-- 1- يبقى كما هوه افتراضي ال self -->
    <a href="https://www.google.com" target="_self">Google self</a>

    <!-- 2- يفتح جوجل بنافذة جديد بس هنا لازم نستخدم ال rel="noopener" لتجنب من الثغرات الاختراق -->
    <a href="https://www.google.com" target="_blank" rel="noopener"> Google _blank </a>

    <!-- 3- تستخدم في اطار الاب  -->
    <a href="https://www.google.com" target="_parent">فتح في الإطار الأب</a>

    <!-- 4- فتح في كامل الصفحة  -->
    <a href="https://www.google.com" target="_top">فتح في كامل الشاشة</a>
  </body>
</html>
